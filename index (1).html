<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jubayer Craft - Mobile 3D Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; touch-action: none; background: #000; }
        canvas { display: block; }

        /* হেডার ইনফো */
        #info {
            position: absolute; top: 10px; left: 10px; right: 10px;
            color: white; background: rgba(0,0,0,0.5);
            padding: 8px 14px; border-radius: 10px; font-size: 12px;
            pointer-events: none; z-index: 100; border-left: 4px solid #4CAF50;
            display: flex; justify-content: space-between; align-items: center;
        }
        #info h2 { font-size: 14px; color: #4CAF50; }
        #info p { opacity: 0.8; font-size: 11px; }

        /* ক্রসহেয়ার */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 28px; font-weight: bold;
            pointer-events: none; z-index: 100;
            text-shadow: 0 0 6px black; opacity: 0.7;
        }

        /* জয়স্টিক */
        #joystick {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            z-index: 200; touch-action: none;
        }
        #joystickKnob {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(76, 175, 80, 0.8);
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
        }

        /* অ্যাকশন বাটন */
        .action-btn {
            position: absolute; z-index: 200;
            width: 65px; height: 65px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.4);
            color: white; font-size: 26px;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            transition: 0.1s;
        }
        .action-btn:active { transform: scale(0.9); background: rgba(76, 175, 80, 0.6); }

        #jumpBtn { bottom: 100px; right: 30px; }
        #breakBtn { bottom: 30px; right: 110px; background: rgba(255, 80, 80, 0.3); }
        #placeBtn { bottom: 30px; right: 30px; background: rgba(80, 150, 255, 0.3); }

        /* হটবার */
        #hotbar {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 200;
        }
        .slot {
            width: 42px; height: 42px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer;
            background: rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .slot.active {
            border-color: #FFD700; transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        /* লোডিং স্ক্রিন */
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 1000; color: white;
        }
        #loading h1 { color: #4CAF50; font-size: 28px; margin-bottom: 20px; }
        #loading .spinner {
            width: 50px; height: 50px; border: 4px solid #333;
            border-top: 4px solid #4CAF50; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">
        <h1>⛏️ Jubayer Craft</h1>
        <div class="spinner"></div>
        <p style="margin-top:15px; color:#888;">লোড হচ্ছে...</p>
    </div>

    <div id="info">
        <h2>⛏️ Jubayer Craft</h2>
        <p>জয়স্টিক = হাঁটা | ড্র্যাগ = ঘোরা</p>
    </div>

    <div id="crosshair">+</div>

    <!-- জয়স্টিক -->
    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>

    <!-- অ্যাকশন বাটন -->
    <div class="action-btn" id="jumpBtn">⬆️</div>
    <div class="action-btn" id="breakBtn">⛏️</div>
    <div class="action-btn" id="placeBtn">🧱</div>

    <!-- হটবার -->
    <div id="hotbar">
        <div class="slot active" data-block="0" onclick="selectBlock(0, this)">🟩</div>
        <div class="slot" data-block="1" onclick="selectBlock(1, this)">🟫</div>
        <div class="slot" data-block="2" onclick="selectBlock(2, this)">⬜</div>
        <div class="slot" data-block="3" onclick="selectBlock(3, this)">🟥</div>
        <div class="slot" data-block="4" onclick="selectBlock(4, this)">🟦</div>
    </div>

    <script>
        // ==================== সেটআপ ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ==================== আলো ====================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ==================== টেক্সচার ====================
        function createTexture(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < 64; i += 8) {
                for (let j = 0; j < 64; j += 8) {
                    if ((i + j) % 16 === 0) ctx.fillRect(i, j, 4, 4);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        const blockTypes = [
            createTexture('#4CAF50'),
            createTexture('#8B4513'),
            createTexture('#9E9E9E'),
            createTexture('#D32F2F'),
            createTexture('#2196F3')
        ];
        const blockMaterials = blockTypes.map(t => new THREE.MeshLambertMaterial({ map: t }));

        // ==================== ব্লক স্টোর ====================
        const blocks = {};
        function getKey(x, y, z) { return `${x},${y},${z}`; }

        function addBlock(x, y, z, typeIndex = 0) {
            const key = getKey(x, y, z);
            if (blocks[key]) return;
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = blockMaterials[typeIndex] || blockMaterials[0];
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { x, y, z, type: typeIndex };
            scene.add(mesh);
            blocks[key] = mesh;
        }

        function removeBlock(x, y, z) {
            const key = getKey(x, y, z);
            if (blocks[key]) {
                scene.remove(blocks[key]);
                blocks[key].geometry.dispose();
                delete blocks[key];
            }
        }

        // ==================== বিশ্ব তৈরি ====================
        const worldSize = 15;
        for (let x = -worldSize; x <= worldSize; x++) {
            for (let z = -worldSize; z <= worldSize; z++) {
                addBlock(x, 0, z, 0);
                if (Math.random() > 0.85) addBlock(x, -1, z, 1);
                if (Math.random() > 0.96 && Math.abs(x) > 2 && Math.abs(z) > 2) {
                    for (let h = 1; h <= 3; h++) addBlock(x, h, z, 1);
                    for (let dx = -1; dx <= 1; dx++)
                        for (let dz = -1; dz <= 1; dz++)
                            addBlock(x + dx, 4, z + dz, 0);
                }
            }
        }
        // ছোট ঘর
        for (let x = 2; x <= 5; x++)
            for (let z = 2; z <= 5; z++)
                addBlock(x, 1, z, 3);

        // ==================== খেলোয়াড় ====================
        const player = { velocityY: 0, onGround: false };
        let yaw = 0, pitch = 0;

        // ==================== জয়স্টিক কন্ট্রোল ====================
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('joystickKnob');
        let joystickActive = false;
        let joystickX = 0, joystickY = 0;

        const joyRect = () => joystick.getBoundingClientRect();
        const joyCenter = () => {
            const r = joyRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        };

        joystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickActive = true;
            updateJoystick(e.touches[0]);
        }, { passive: false });

        joystick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (joystickActive) updateJoystick(e.touches[0]);
        }, { passive: false });

        joystick.addEventListener('touchend', (e) => {
            e.preventDefault();
            joystickActive = false;
            joystickX = 0; joystickY = 0;
            knob.style.transform = 'translate(-50%, -50%)';
        }, { passive: false });

        function updateJoystick(touch) {
            const c = joyCenter();
            let dx = touch.clientX - c.x;
            let dy = touch.clientY - c.y;
            const maxDist = 45;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickX = dx / maxDist;
            joystickY = dy / maxDist;
        }

        // ==================== ক্যামেরা ড্র্যাগ (লুক) ====================
        let touchLookActive = false;
        let lastTouchX = 0, lastTouchY = 0;
        const lookSensitivity = 0.005;

        document.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            // জয়স্টিক বা বাটনে টাচ হলে ইগনোর
            if (e.target.closest('#joystick') || e.target.closest('.action-btn') || e.target.closest('.slot')) return;
            touchLookActive = true;
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!touchLookActive) return;
            const t = e.touches[0];
            const dx = t.clientX - lastTouchX;
            const dy = t.clientY - lastTouchY;
            yaw -= dx * lookSensitivity;
            pitch -= dy * lookSensitivity;
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;
        }, { passive: false });

        document.addEventListener('touchend', () => { touchLookActive = false; });

        // ==================== অ্যাকশন বাটন ====================
        document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.onGround) { player.velocityY = 0.25; player.onGround = false; }
        }, { passive: false });

        let selectedBlockType = 0;
        function selectBlock(index, element) {
            selectedBlockType = index;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            element.classList.add('active');
        }

        // ব্লক ভাঙা
        document.getElementById('breakBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            doRaycast('break');
        }, { passive: false });

        // ব্লক বসানো
        document.getElementById('placeBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            doRaycast('place');
        }, { passive: false });

        // ==================== রে কাস্টিং ====================
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        function doRaycast(action) {
            raycaster.setFromCamera(center, camera);
            const meshes = Object.values(blocks);
            const hits = raycaster.intersectObjects(meshes);
            if (hits.length > 0) {
                const hit = hits[0];
                const b = hit.object;
                if (action === 'break') {
                    removeBlock(b.userData.x, b.userData.y, b.userData.z);
                } else if (action === 'place') {
                    const n = hit.face.normal;
                    addBlock(b.userData.x + n.x, b.userData.y + n.y, b.userData.z + n.z, selectedBlockType);
                }
            }
        }

        // ==================== কলিশন ====================
        function checkCollision(x, y, z) {
            const positions = [
                [Math.floor(x), Math.floor(y - 1), Math.floor(z)],
                [Math.floor(x), Math.floor(y), Math.floor(z)]
            ];
            for (const [bx, by, bz] of positions) {
                if (blocks[getKey(bx, by, bz)]) return true;
            }
            return false;
        }

        // ==================== আপডেট ====================
        function updatePlayer() {
            const speed = 0.1;
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

            const move = new THREE.Vector3();
            // জয়স্টিক: Y নিচে মানে সামনে
            if (joystickY < -0.15) move.add(forward);
            if (joystickY > 0.15) move.sub(forward);
            if (joystickX < -0.15) move.sub(right);
            if (joystickX > 0.15) move.add(right);

            if (move.length() > 0) {
                move.normalize().multiplyScalar(speed);
                const nx = camera.position.x + move.x;
                if (!checkCollision(nx, camera.position.y, camera.position.z)) camera.position.x = nx;
                const nz = camera.position.z + move.z;
                if (!checkCollision(camera.position.x, camera.position.y, nz)) camera.position.z = nz;
            }

            // মাধ্যাকর্ষণ
            player.velocityY -= 0.015;
            const ny = camera.position.y + player.velocityY;
            if (checkCollision(camera.position.x, ny, camera.position.z)) {
                player.velocityY = 0;
                player.onGround = true;
            } else {
                camera.position.y = ny;
                player.onGround = false;
            }

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        // ==================== লুপ ====================
        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            renderer.render(scene, camera);
        }

        // ==================== রিসাইজ ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== শুরু ====================
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            animate();
        }, 800);
    </script>
</body>
</html>
